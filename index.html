<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var theme = localStorage.getItem('tetris-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" id="gameover-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="overlay-btn">Reiniciar</button>
      </div>

      <div class="overlay-box hidden" id="pause-menu-box">
        <p class="overlay-heading">PAUSA</p>

        <div id="pause-main" class="pause-screen">
          <button id="resume-btn" class="overlay-btn">Reanudar</button>
          <button id="pause-restart-btn" class="overlay-btn">Reiniciar</button>
          <button id="controls-btn" class="overlay-btn">Ver controles</button>
          <div class="level-select">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-stepper">
              <button id="level-down-btn" type="button" aria-label="Bajar nivel inicial">−</button>
              <span id="level-value">1</span>
              <button id="level-up-btn" type="button" aria-label="Subir nivel inicial">+</button>
            </div>
          </div>
        </div>

        <div id="pause-controls" class="pause-screen hidden">
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="controls-back-btn" class="overlay-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
